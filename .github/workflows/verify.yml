name: ZooDoo checks
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
permissions:
  contents: read
concurrency:
  group: zoodoo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  merge-policy:
    name: Merge policy
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as the source of main pull requests
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          if (pr?.base.ref === 'main' && (pr.head.ref !== 'staging' || pr.head.repo.full_name !== process.env.EXPECTED_REPOSITORY)) {
            console.error('Main accepts pull requests from this repository staging branch only.');
            process.exit(1);
          }
          JS
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=low
      - name: Check API runtime package
        run: |
          pnpm --filter @zoodoo/api deploy --prod artifacts/api-package
          cd artifacts/api-package
          node ../../api/node_modules/prisma/build/index.js generate --schema schema.prisma
          node --input-type=module -e 'import {PrismaClient} from "@prisma/client"; const db=new PrismaClient(); await db.$disconnect();'
